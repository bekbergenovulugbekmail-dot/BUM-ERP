appId: uz.bumerp.kassa
productName: BUM POS KASSA
copyright: BUM ERP
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Electron fuses: kassa binari Node sifatida ishga tushirilmaydi (ELECTRON_RUN_AS_NODE), NODE_OPTIONS va --inspect
# e'tiborsiz — mahalliy zararli dastur kassa nomi ostida kod bajara olmasin. Asar yaxlitligi va faqat asar'dan yuklash
# paketlangan ilova ishga tushirib sinalgach yoqiladi.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BUM-POS-KASSA-Setup-${version}.${ext}
  icon: build/icon.ico
  # Kod imzosi: sertifikat muhitdan beriladi — CSC_LINK (.pfx yo'li yoki base64) va CSC_KEY_PASSWORD.
  # Berilmasa o'rnatuvchi imzosiz yig'iladi (Windows SmartScreen "noma'lum nashriyotchi" deb ogohlantiradi).
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BUM POS KASSA
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
