appId: uz.bumerp.kassa
productName: BUM POS KASSA
copyright: BUM ERP
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BUM-POS-KASSA-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BUM POS KASSA
