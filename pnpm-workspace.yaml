packages:
  - .
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - electron

blockExoticSubdeps: true

minimumReleaseAge: 4320
allowBuilds:
  "@swc/core": true
  core-js: false
  esbuild: true
  # Desktop kassa: o'rnatishda Electron binarini yuklab oladi
  electron: true
  # electron-builder'ning Squirrel o'rnatuvchisi — ishlatilmaydi (NSIS)
  electron-winstaller: false
