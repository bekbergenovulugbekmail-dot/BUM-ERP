# Lokal ishlab chiqish muhiti.
# Production Railway'da, lekin bu fayl bir xil komponentlarni ko'taradi —
# ya'ni VPS'ga ko'chish `docker compose up` darajasida qoladi.
services:
  postgres:
    image: postgres:18
    container_name: bum-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bumerp
      POSTGRES_DB: bumerp
    ports:
      - "5432:5432"
    volumes:
      # PG18 image'i ma'lumotni /var/lib/postgresql/18/docker ga yozadi,
      # shuning uchun volume eski .../data ga emas, ota papkaga ulanadi.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bumerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bum_minio
      MINIO_ROOT_PASSWORD: bum_minio_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
