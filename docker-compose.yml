# Lokal ishlab chiqish muhiti.
# Production Railway'da, lekin bu fayl bir xil komponentlarni ko'taradi —
# ya'ni VPS'ga ko'chish `docker compose up` darajasida qoladi.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bum
      POSTGRES_PASSWORD: bum_local_dev
      POSTGRES_DB: bum_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bum -d bum_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bum_minio
      MINIO_ROOT_PASSWORD: bum_minio_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
